<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E8A8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KT Lernzeit">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>KT Lernzeit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: one column app shell — sticky bar, student list, student page with tabs; groups coded teal (Jungs) and pink (Mädchen) like the KT Jugend plan */
:root{
  --bg:#f2f2ee; --surface:#ffffff; --sunk:#e9e9e3; --ink:#202124; --muted:#676a62; --line:#d9dad2;
  --gold:#7d7322; --gold-soft:#ece6bd;
  --jungs:#0b7f80; --jungs-soft:#d5eeee; --maedchen:#b8327f; --maedchen-soft:#f6dcea;
  --good:#2b7d45; --good-soft:#dbefe1; --warn:#9a6512; --warn-soft:#f6e8cc; --bad:#b33a2e; --bad-soft:#f6dcd8;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1d21; --surface:#2a282d; --sunk:#252328; --ink:#f0eee7; --muted:#a6a39a; --line:#3c3940;
  --gold:#d2c779; --gold-soft:#3b3826;
  --jungs:#3cc4c4; --jungs-soft:#163a3b; --maedchen:#ec7cbc; --maedchen-soft:#45223a;
  --good:#6fcf8e; --good-soft:#1d3a26; --warn:#e3b05c; --warn-soft:#3d3020; --bad:#f08a7d; --bad-soft:#452622;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1d21; --surface:#2a282d; --sunk:#252328; --ink:#f0eee7; --muted:#a6a39a; --line:#3c3940;
  --gold:#d2c779; --gold-soft:#3b3826;
  --jungs:#3cc4c4; --jungs-soft:#163a3b; --maedchen:#ec7cbc; --maedchen-soft:#45223a;
  --good:#6fcf8e; --good-soft:#1d3a26; --warn:#e3b05c; --warn-soft:#3d3020; --bad:#f08a7d; --bad-soft:#452622;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.01em;color:var(--gold);line-height:1;text-transform:uppercase}
.brand small{display:block;font:500 10px/1.4 var(--body);letter-spacing:.14em;color:var(--muted)}
.grow{flex:1}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--surface);font-size:11px;font-weight:600;flex:none}
.g-jungs{--g:var(--jungs);--gs:var(--jungs-soft)} .g-maedchen{--g:var(--maedchen);--gs:var(--maedchen-soft)} .g-leitung{--g:var(--gold);--gs:var(--gold-soft)}
.dot{background:var(--g)}
main{padding-block:18px 60px;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--gs);color:var(--g);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 9px;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
.tag button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:15px;line-height:1}
.s-good{background:var(--good-soft);color:var(--good)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-none{background:var(--sunk);color:var(--muted)}
.chip{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.example{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:1px 6px}
/* list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{text-align:left;border:1px solid var(--line);border-left:4px solid var(--g);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;min-width:0}
.card .name{font-weight:600;font-size:16px}
.card .meta{font-size:13px;color:var(--muted)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
/* student */
.head{display:grid;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.grade{font-weight:600;display:inline-block;min-width:2.4em;text-align:center;border-radius:6px;padding:1px 6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.adder{display:flex;gap:6px}
.adder input{flex:1;min-width:0}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.adder input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;color:var(--ink);font-size:15px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
textarea{min-height:80px;resize:vertical}
.sub-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.spark{display:block}
.spark path{fill:none;stroke:var(--g);stroke-width:2}
.spark circle{fill:var(--g)}
.spark line{stroke:var(--line);stroke-width:1}
/* timetable */
.grid-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:34px repeat(5,minmax(58px,1fr));gap:4px;min-width:340px}
.tt .h{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.tt .n{font-size:12px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tt button.c{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;font-weight:500;padding:2px;line-height:1.2;overflow-wrap:anywhere}
.tt button.c.f{background:var(--gs);border-color:transparent;color:var(--ink)}
.brush{display:flex;gap:6px;flex-wrap:wrap}
.brush button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.brush button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 12px;font-size:14px}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
.brand{border:0;background:none;padding:0;text-align:left}
.logo{width:40px;height:40px;border-radius:10px;flex:none}
/* Startseite */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.door{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px 20px;text-align:left;display:grid;gap:8px;min-width:0}
.door b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.door span{color:var(--muted);font-size:14px}
.door.t{border-top:6px solid var(--gold)} .door.s{border-top:6px solid var(--jungs)}
/* Schülerbereich */
.codebox{font-family:var(--display);font-size:20px;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.codein{font-family:var(--display);font-size:28px;letter-spacing:.25em;text-transform:uppercase;text-align:center;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{border:0;border-radius:16px;padding:20px;text-align:left;display:grid;gap:6px;background:var(--gs);color:var(--ink);min-height:120px;align-content:space-between}
.tile b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--g)}
.sub-Deutsch{--g:var(--bad);--gs:var(--bad-soft)} .sub-Englisch{--g:var(--jungs);--gs:var(--jungs-soft)} .sub-Mathe{--g:var(--gold);--gs:var(--gold-soft)}
.sheetrow{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%}
.quiz{display:grid;gap:16px}
.qtext{font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.35;text-wrap:balance}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.progress i{display:block;height:100%;background:var(--g)}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:18px;text-align:left;min-height:56px}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.ansin{font-size:20px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.fb{border-radius:12px;padding:12px 14px;font-weight:500}
.big{font-size:17px;padding:12px 20px;border-radius:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
</style>

</head>
<body>
<div class="bar"><div class="wrap">
  <img class="logo" src="icon.svg" alt="" width="40" height="40"><button class="brand" data-act="home">KT Lernzeit<small>KOCATEPE GENÇLİK RUHRORT</small></button>
  <div class="grow"></div>
  <div class="row" id="barRight"></div>
</div></div>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
/* ---------- Daten ---------- */
const KEY="kt-lernzeit-v1";
const GROUPS={jungs:{label:"Jungs",days:"Di & Mi"},maedchen:{label:"Mädchen",days:"Do"},leitung:{label:"Leitung",days:"alle Tage"}};
const SCHULFORMEN=["Grundschule","Hauptschule","Realschule","Sekundarschule","Gesamtschule","Gymnasium","Förderschule"];
const SUBJECTS=["Deutsch","Englisch","Mathe","Sachunterricht","Biologie","Physik","Chemie","NW","GL","Erdkunde","Geschichte","Politik","Französisch","Latein","Spanisch","Türkisch","Informatik","Religion","Kunst","Musik","Sport","Technik","Hauswirtschaft"];
const GRADES=["1+","1","1-","2+","2","2-","3+","3","3-","4+","4","4-","5+","5","5-","6"];
const DAYS=["Mo","Di","Mi","Do","Fr"];
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toLocaleDateString("sv");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gval=g=>{if(!g)return null;const b=parseInt(g,10);return g.endsWith("+")?b-.3:g.endsWith("-")?b+.3:b};
const fmt=n=>n==null||isNaN(n)?"–":n.toFixed(1).replace(".",",");
const fdate=d=>d?new Date(d+"T12:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}):"";
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const level=n=>n==null?"s-none":n<=2.5?"s-good":n<=3.5?"s-warn":"s-bad";
const usesLernzeit=s=>s.schulform==="Gesamtschule";
const workLabel=s=>usesLernzeit(s)?"Lernzeit":"Hausaufgaben";
const workKinds=s=>[usesLernzeit(s)?"Lernzeit-Aufgaben":"Hausaufgaben","Nacharbeit","Vorbereitung Klassenarbeit","Üben"];

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString("sv")}
function seed(){
  const me={id:uid(),name:"Leitung",group:"leitung"};
  const ex=(o)=>Object.assign({id:uid(),example:true,created:today(),schule:"",note:"",strengths:[],focus:[],exams:[],reports:[],plan:{},log:[],subjects:["Deutsch","Englisch","Mathe"]},o);
  const E=(subject,kind,d,grade,topic)=>({id:uid(),subject,kind,date:daysAgo(d),grade,topic});
  return {v:1,me:me.id,teachers:[me],students:[
    ex({first:"Yusuf",last:"Beispiel",group:"jungs",klasse:7,schulform:"Gesamtschule",
      strengths:["Kopfrechnen","liest gern"],focus:["Bruchrechnung","Textaufgaben"],note:"Braucht beim Start eine klare Aufgabe, dann arbeitet er konzentriert.",
      exams:[E("Mathe","Klassenarbeit",110,"4"),E("Mathe","Klassenarbeit",60,"3-","Brüche"),E("Mathe","Test",20,"3","Prozent"),E("Deutsch","Klassenarbeit",80,"3"),E("Deutsch","Klassenarbeit",30,"3+","Bericht"),E("Englisch","Klassenarbeit",70,"2-"),E("Englisch","Test",25,"2","Simple Past")],
      reports:[{id:uid(),label:"Halbjahr 6.2",date:daysAgo(130),grades:{Deutsch:"3",Englisch:"2",Mathe:"4"}}],
      plan:{"0-0":"Mathe","0-1":"Mathe","0-2":"Deutsch","0-3":"Deutsch","1-0":"Englisch","1-1":"Englisch","1-2":"GL","2-0":"Mathe","2-1":"NW","3-0":"Deutsch","3-2":"Englisch","4-0":"Sport","4-1":"Sport"},
      log:[{id:uid(),date:daysAgo(1),kind:"Lernzeit-Aufgaben",subject:"Mathe",status:"erledigt",note:"Brüche erweitern, 12 Aufgaben"},{id:uid(),date:daysAgo(2),kind:"Nacharbeit",subject:"Deutsch",status:"teilweise",note:"Bericht überarbeitet"},{id:uid(),date:daysAgo(8),kind:"Vorbereitung Klassenarbeit",subject:"Mathe",status:"erledigt",note:""}]}),
    ex({first:"Emre",last:"Beispiel",group:"jungs",klasse:4,schulform:"Grundschule",subjects:["Deutsch","Mathe","Sachunterricht"],
      strengths:["Einmaleins"],focus:["Rechtschreibung"],
      exams:[E("Deutsch","Test",40,"4+","Diktat"),E("Deutsch","Test",12,"3-","Diktat"),E("Mathe","Klassenarbeit",30,"2")],
      log:[{id:uid(),date:daysAgo(1),kind:"Hausaufgaben",subject:"Deutsch",status:"erledigt",note:"Lernwörter"}]}),
    ex({first:"Elif",last:"Beispiel",group:"maedchen",klasse:9,schulform:"Realschule",
      strengths:["Englisch mündlich","sehr selbstständig"],focus:["Lineare Funktionen"],
      exams:[E("Mathe","Klassenarbeit",70,"3"),E("Mathe","Klassenarbeit",25,"3-","Funktionen"),E("Englisch","Klassenarbeit",50,"1-"),E("Deutsch","Klassenarbeit",45,"2")],
      reports:[{id:uid(),label:"Halbjahr 8.2",date:daysAgo(130),grades:{Deutsch:"2",Englisch:"1",Mathe:"3"}}],
      log:[{id:uid(),date:daysAgo(6),kind:"Hausaufgaben",subject:"Mathe",status:"nicht geschafft",note:"Steigung noch unklar"}]})
  ]};
}
const CODECH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(){let c;do{c=Array.from({length:6},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join("")}while(DB&&DB.students.some(s=>s.code===c));return c}
const TASK_SUBJECTS=["Deutsch","Englisch","Mathe"];
function seedSheets(){
  const C=(q,opts)=>{const correct=opts.findIndex(o=>o.startsWith("*"));return{id:uid(),type:"choice",q,options:opts.map(o=>o.replace(/^\*/,"")),correct}};
  const I=(q,ans)=>({id:uid(),type:"input",q,answers:ans});
  const S=(subject,title,minK,maxK,items)=>({id:uid(),subject,title,minK,maxK,groups:["jungs","maedchen"],items,created:today(),example:true});
  return[
    S("Mathe","Brüche erweitern und kürzen",5,8,[I("Erweitere 2/3 mit 4.",["8/12"]),I("Kürze 6/9 so weit wie möglich.",["2/3"]),C("Welcher Bruch ist größer?",["1/2","*3/4","2/5"]),I("Wie viel ist 1/4 + 2/4?",["3/4"])]),
    S("Mathe","Einmaleins gemischt",2,5,[I("7 · 8 =",["56"]),I("6 · 9 =",["54"]),I("48 : 6 =",["8"]),C("Welche Zahl ist durch 7 teilbar?",["45","*63","52"])]),
    S("Englisch","Simple Past",5,9,[I("go → simple past:",["went"]),I("buy → simple past:",["bought"]),C("Yesterday I ___ football.",["play","*played","playing"]),C("She ___ to school last Monday.",["*walked","walks","walk"])]),
    S("Deutsch","das oder dass?",4,9,[C("Ich hoffe, ___ du kommst.",["das","*dass"]),C("___ Buch liegt auf dem Tisch.",["*Das","Dass"]),C("Das Auto, ___ dort steht, ist rot.",["*das","dass"]),C("Er sagt, ___ es regnet.",["das","*dass"])])
  ];
}
function migrate(d){
  d.sheets=d.sheets||seedSheets();d.attempts=d.attempts||[];
  if(!d.duty)d.duty={std:{},dates:{},off:{}};
  d.students.forEach(s=>{if(!s.code){let c;do{c=Array.from({length:6},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join("")}while(d.students.some(x=>x.code===c));s.code=c}});
  return d;
}
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return migrate(mem||seed())}

function subjStats(s,sub){
  const ex=s.exams.filter(e=>e.subject===sub).sort((a,b)=>a.date.localeCompare(b.date));
  const vals=ex.map(e=>gval(e.grade));
  const rep=[...s.reports].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).find(r=>r.grades[sub]);
  const trend=vals.length>1?vals[vals.length-1]-vals[vals.length-2]:null;
  return {ex,vals,avg:avg(vals),last:vals[vals.length-1]??null,rep:rep?rep.grades[sub]:null,trend};
}
function statusOf(st){const n=st.avg??gval(st.rep);if(n==null)return["s-none","noch keine Noten"];if(n<=2.5)return["s-good","Stärke"];if(n<=3.5)return["s-warn","im Blick behalten"];return["s-bad","Förderbedarf"]}
function trendTxt(t){if(t==null)return"";if(t<=-.3)return`<span class="chip s-good" title="besser als die Arbeit davor">▲ besser</span>`;if(t>=.3)return`<span class="chip s-bad" title="schlechter als die Arbeit davor">▼ schlechter</span>`;return`<span class="chip s-none">= gleich</span>`}
function spark(vals){
  if(vals.length<2)return"";const w=110,h=34,p=4,y=v=>p+(v-1)/5*(h-2*p),x=i=>p+i*(w-2*p)/(vals.length-1);
  const d=vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Notenverlauf"><line x1="0" x2="${w}" y1="${y(4)}" y2="${y(4)}"/><path d="${d}"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3"/></svg>`;
}

/* ---------- Einsatzplan ---------- */
const DUTY_DAYS=[{d:1,name:"Dienstag",group:"jungs"},{d:2,name:"Mittwoch",group:"jungs"},{d:3,name:"Donnerstag",group:"maedchen"}];
const SLOTS=[{k:"lern",label:"Hausaufgaben & Lernzeit",time:"16:30–18:00"},{k:"abend",label:"Abendbrot & Spiele",time:"18:00–19:30"}];
function monday(off){const t=new Date();t.setHours(12,0,0,0);const wd=(t.getDay()+6)%7;t.setDate(t.getDate()-wd+off*7);return t}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+n);return x.toLocaleDateString("sv")}
function kw(dt){const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)}
function dutyGet(date,dd,k){const o=DB.duty.dates[date+"|"+k];return o!==undefined?o:(DB.duty.std[dd+"-"+k]||[])}
const tName=id=>DB.teachers.find(t=>t.id===id);
function canDo(t,group){return t.group==="leitung"||t.group===group}
function nextDuty(){
  const t=me();for(let w=0;w<8;w++){const m=monday(w);for(const D of DUTY_DAYS){const date=addDays(m,D.d);if(date<today()||DB.duty.off[date])continue;for(const S of SLOTS){if(dutyGet(date,D.d,S.k).includes(t.id))return{date,D,S}}}}return null;
}
function viewDuty(){
  const std=ui.dutyMode==="std",m=monday(ui.week),t=me(),nx=nextDuty();
  const days=DUTY_DAYS.filter(D=>t.group==="leitung"||D.group===t.group);
  return`<div class="head"><div class="eyebrow">Wer ist wann da?</div><h1>Einsatzplan</h1></div>
  <div class="toolbar">${navSeg()}<div class="seg" role="group" aria-label="Ansicht"><button data-act="dutyMode" data-v="week" aria-pressed="${!std}">Wochen</button><button data-act="dutyMode" data-v="std" aria-pressed="${std}">Regelplan</button></div></div>
  ${std?`<p class="note">Der Regelplan gilt jede Woche. Abweichungen (Krankheit, Tausch, Ferien) trägst du in der Wochenansicht ein.</p>`:`
  <div class="panel g-${t.group}" style="grid-template-columns:1fr auto;align-items:center"><div><div class="eyebrow">Dein nächster Einsatz, ${esc(t.name)}</div><div style="font-weight:600">${nx?`${nx.D.name}, ${fdate(nx.date)} · ${nx.S.time} · ${nx.S.label}`:"In den nächsten acht Wochen bist du nicht eingeteilt."}</div></div></div>
  <div class="sub-head"><button class="btn" data-act="week" data-v="-1" aria-label="Woche zurück">←</button><div style="text-align:center"><b>KW ${kw(m)}</b><div class="small muted">${fdate(addDays(m,0))} – ${fdate(addDays(m,4))}${ui.week?` · <button class="btn ghost" style="padding:0" data-act="week" data-v="0">heute</button>`:""}</div></div><button class="btn" data-act="week" data-v="1" aria-label="Woche vor">→</button></div>`}
  ${days.map(D=>{const date=std?null:addDays(m,D.d),off=date&&DB.duty.off[date];
    return`<section class="panel g-${D.group}"><div class="sub-head"><div><h2>${D.name}${date?`, ${fdate(date)}`:""}</h2><span class="pill">${GROUPS[D.group].label}</span></div>
      ${date?`<button class="btn ${off?"":"ghost"}" data-act="dayOff" data-v="${date}">${off?"Findet doch statt":"Fällt aus"}</button>`:""}</div>
      ${off?`<div class="chip s-warn" style="justify-self:start">Fällt aus</div>`:SLOTS.map(S=>{
        const ids=std?(DB.duty.std[D.d+"-"+S.k]||[]):dutyGet(date,D.d,S.k),key=(date||"std")+"|"+D.d+"|"+S.k,editing=ui.dutyEdit===key,changed=date&&DB.duty.dates[date+"|"+S.k]!==undefined;
        return`<div class="item"><div class="sub-head"><div><b>${S.time}</b> <span class="muted small">${S.label}</span></div><button class="btn ghost" data-act="dutyEdit" data-v="${key}">${editing?"Fertig":"Ändern"}</button></div>
          ${editing?`<div class="choice">${DB.teachers.filter(x=>canDo(x,D.group)).map(x=>`<button type="button" data-act="dutyToggle" data-v="${key}" data-id="${x.id}" aria-pressed="${ids.includes(x.id)}">${esc(x.name)}</button>`).join("")}</div>`
          :`<div class="row">${ids.length?ids.map(i=>tName(i)).filter(Boolean).map(x=>`<span class="pill g-${x.group}"><span class="dot" style="width:16px;height:16px;font-size:9px">${esc(x.name[0])}</span>${esc(x.name)}</span>`).join(""):'<span class="chip s-bad">Niemand eingeteilt</span>'}</div>`}
          ${changed?`<div class="small muted">Abweichend vom Regelplan · <button class="btn ghost" style="padding:0" data-act="dutyReset" data-v="${key}">zurücksetzen</button></div>`:""}

function saveTask(){
  readTask();const d=ui.sheet.data;
  if(!d.title)return"Bitte einen Titel eintragen.";
  if(d.minK>d.maxK)return"„Ab Klasse“ ist größer als „Bis Klasse“.";
  if(!d.groups.length)return"Bitte mindestens eine Gruppe wählen.";
  const items=[];
  for(const [i,it] of d.items.entries()){
    if(!it.q.trim())return`Aufgabe ${i+1}: Bitte eine Frage eintragen.`;
    if(it.type==="choice"){const lines=it.optText.split("\n").map(l=>l.trim()).filter(Boolean);const stars=lines.filter(l=>l.startsWith("*")&&l.length>1);
      if(lines.length<2)return`Aufgabe ${i+1}: Bitte mindestens zwei Antworten eintragen.`;
      if(stars.length!==1)return`Aufgabe ${i+1}: Bitte genau eine Antwort mit * als richtig markieren.`;
      items.push({id:it.id,type:"choice",q:it.q.trim(),options:lines.map(l=>l.replace(/^\*\s*/,"")),correct:lines.findIndex(l=>l.startsWith("*"))});
    }else{const ans=it.ansText.split("|").map(a=>a.trim()).filter(Boolean);if(!ans.length)return`Aufgabe ${i+1}: Bitte die richtige Antwort eintragen.`;items.push({id:it.id,type:"input",q:it.q.trim(),answers:ans})}
  }
  const clean={id:d.id,subject:d.subject,title:d.title,minK:d.minK,maxK:d.maxK,groups:d.groups,items,created:d.created};
  const k=DB.sheets.findIndex(x=>x.id===d.id);if(k>=0)DB.sheets[k]=clean;else DB.sheets.push(clean);
  save();return null;
}

function tabOverview(s){

  const repAvg=lastRep?avg(Object.values(lastRep.grades).map(gval)):null;
  const recent=s.log.filter(l=>l.date>=daysAgo(28));
  const done=recent.length?Math.round(recent.filter(l=>l.status==="erledigt").length/recent.length*100):null;
  const auto=all.filter(([,st])=>statusOf(st)[0]==="s-bad").map(([sub])=>sub);
  return`

}
function readStudentForm(){const d=ui.sheet.data;d.first=$("#f-first").value.trim();d.last=$("#f-last").value.trim();d.klasse=+$("#f-klasse").value;if(!$("#f-group").disabled)d.group=$("#f-group").value;d.schule=$("#f-schule").value.trim()}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,v=a.dataset.v,s=cur();
  if(act==="close"&&a.classList.contains("scrim")&&e.target!==a)return;
  if(!["ask","del","delStudent","delExamples","tkRemove"].includes(act))ui.confirm=null;
  switch(act){
    case"open":ui.sid=id;ui.view="student";ui.tab="overview";scrollTo(0,0);break;
    case"back":ui.view="list";ui.sid=null;break;
    case"dutyMode":ui.dutyMode=v;ui.dutyEdit=null;break;
    case"week":ui.week=v==="0"?0:ui.week+ +v;ui.dutyEdit=null;break;
    case"dutyEdit":ui.dutyEdit=ui.dutyEdit===v?null:v;break;
    case"dayOff":DB.duty.off[v]?delete DB.duty.off[v]:DB.duty.off[v]=true;save();break;
    case"dutyToggle":{const [date,dd,k]=v.split("|");let arr;
      if(date==="std"){arr=DB.duty.std[dd+"-"+k]=DB.duty.std[dd+"-"+k]||[]}
      else{const key=date+"|"+k;if(DB.duty.dates[key]===undefined)DB.duty.dates[key]=[...(DB.duty.std[dd+"-"+k]||[])];arr=DB.duty.dates[key]}
      const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id);save();break}
    case"dutyReset":{const [date,,k]=v.split("|");delete DB.duty.dates[date+"|"+k];save();break}
    case"home":ui.mode="start";ui.stu=null;ui.quiz=null;ui.subj=null;ui.sheet=null;ui.view="list";break;
    case"asTeacher":ui.mode="pickTeacher";break;
    case"pickT":DB.me=id;ui.filter="alle";save();ui.mode="teacher";ui.view="list";break;
    case"asStudent":ui.mode="login";ui.loginErr="";render();$("#code")?.focus();return;
    case"nav":ui.view=v;ui.sid=null;break;
    case"subj":ui.subj=v||null;break;
    case"startQuiz":ui.quiz={sheetId:id,i:0,given:null,results:[]};scrollTo(0,0);break;
    case"quitQuiz":ui.quiz=null;break;
    case"choose":if(ui.quiz.given===null)answerQ(+v);break;
    case"nextQ":{const Q=ui.quiz,sh=DB.sheets.find(x=>x.id===Q.sheetId);Q.i++;Q.given=null;
      if(Q.i>=sh.items.length){DB.attempts.push({id:uid(),sid:ui.stu,sheetId:sh.id,date:new Date().toISOString(),score:Q.results.filter(Boolean).length,total:sh.items.length});save()}
      render();if(Q.i<sh.items.length)$("#ans")?.focus();return}
    case"newTask":return openTask(null);
    case"editTask":return openTask(DB.sheets.find(x=>x.id===id));
    case"tkSub":readTask();ui.sheet.data.subject=v;break;
    case"tkGroup":{readTask();const G=ui.sheet.data.groups,i=G.indexOf(v);i>=0?G.splice(i,1):G.push(v);break}
    case"tkType":{readTask();const i=+a.dataset.i,it=ui.sheet.data.items[i];if(it.type!==v){const n=blankItem(v);n.q=it.q;n.id=it.id;ui.sheet.data.items[i]=n}break}
    case"tkAdd":readTask();ui.sheet.data.items.push(blankItem(ui.sheet.data.items.at(-1).type));break;
    case"tkDel":readTask();ui.sheet.data.items.splice(+a.dataset.i,1);break;
    case"tkSave":{const err=saveTask();if(err){ui.sheet.err=err;break}toast(ui.sheet.isNew?"Aufgabenblatt veröffentlicht":"Gespeichert");ui.sheet=null;break}
    case"tkRemove":{const id2=ui.sheet.data.id;DB.sheets=DB.sheets.filter(x=>x.id!==id2);DB.attempts=DB.attempts.filter(x=>x.sheetId!==id2);ui.sheet=null;ui.confirm=null;save();toast("Blatt gelöscht");break}
    case"team":ui.view="team";break;
    case"tab":ui.tab=v;break;
    case"filter":ui.filter=v;break;
    case"newStudent":return openStudentSheet(true);
    case"editStudent":return openStudentSheet(false);
    case"close":ui.sheet=null;break;
    case"pickForm":readStudentForm();ui.sheet.data.schulform=v;break;
    case"pickSub":{readStudentForm();const L=ui.sheet.data.subjects;const i=L.indexOf(v);i>=0?L.splice(i,1):L.push(v);break}
    case"saveStudent":{readStudentForm();const d=ui.sheet.data;
      if(!d.first){ui.sheet.err="Bitte einen Vornamen eintragen.";break}
      if(!d.schulform){ui.sheet.err="Bitte die Schulform wählen.";break}
      if(!d.subjects.length){ui.sheet.err="Bitte mindestens ein Fach wählen.";break}
      if(ui.sheet.isNew){const n=Object.assign({id:uid(),code:newCode(),created:today(),note:"",strengths:[],focus:[],exams:[],reports:[],plan:{},log:[]},d);delete n.err;DB.students.push(n);ui.sid=n.id;ui.view="student";ui.tab="overview";toast(d.first+" hinzugefügt")}
      else{Object.assign(s,{first:d.first,last:d.last,klasse:d.klasse,group:d.group,schule:d.schule,schulform:d.schulform,subjects:d.subjects});toast("Gespeichert")}
      ui.sheet=null;save();break}
    case"delStudent":{const n=s.first;DB.students=DB.students.filter(x=>x.id!==s.id);ui.sheet=null;ui.view="list";ui.sid=null;ui.confirm=null;save();toast(n+" entfernt");break}
    case"ask":ui.confirm=a.dataset.k+(id||"");break;
    case"del":{const k=a.dataset.k;
      if(k==="exam")s.exams=s.exams.filter(x=>x.id!==id);
      if(k==="report")s.reports=s.reports.filter(x=>x.id!==id);
      if(k==="log")s.log=s.log.filter(x=>x.id!==id);
      if(k==="teacher"){DB.teachers=DB.teachers.filter(x=>x.id!==id);for(const o of [DB.duty.std,DB.duty.dates])for(const kk in o)o[kk]=o[kk].filter(x=>x!==id)}
      ui.confirm=null;save();toast("Gelöscht");break}
    case"delExamples":{const gone=DB.students.filter(x=>x.example).map(x=>x.id);DB.students=DB.students.filter(x=>!x.example);DB.attempts=DB.attempts.filter(x=>!gone.includes(x.sid));}ui.confirm=null;save();toast("Beispiele gelöscht");break;
    case"delTag":s[a.dataset.k].splice(+a.dataset.i,1);save();break;
    case"brush":ui.brush=v;break;
    case"cell":{if(ui.brush)s.plan[a.dataset.c]=ui.brush;else delete s.plan[a.dataset.c];save();break}
    case"newReport":ui.sheet={type:"report"};break;
    case"saveReport":{const grades={};s.subjects.forEach((sub,i)=>{const g=$("#r-g"+i).value;if(g)grades[sub]=g});
      if(!Object.keys(grades).length){toast("Bitte mindestens eine Note wählen");return}
      s.reports.push({id:uid(),label:$("#r-label").value.trim()||"Zeugnis",date:$("#r-date").value,grades});ui.sheet=null;save();toast("Zeugnis gespeichert");break}
    case"switch":DB.me=id;ui.filter="alle";save();toast("Du bist jetzt "+me().name);ui.view="list";break;
    default:return;
  }
  render();
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const s=cur();
  switch(f.dataset.form){
    case"login":{const c=$("#code").value.trim().toUpperCase(),x=DB.students.find(y=>y.code===c);
      if(!x){ui.loginErr=c?"Diesen Code gibt es nicht. Prüfe ihn noch einmal.":"Bitte gib deinen Code ein.";render();$("#code").focus();return}
      ui.mode="student";ui.stu=x.id;ui.subj=null;ui.quiz=null;ui.loginErr="";render();return}
    case"answer":{const v=$("#ans").value.trim();if(!v)return;answerQ(v);render();return}
    case"tag":{const k=f.dataset.k,inp=$("#tag-"+k),t=inp.value.trim();if(!t)return;s[k].push(t);save();render();$("#tag-"+k).focus();return}
    case"exam":s.exams.push({id:uid(),subject:$("#ex-sub").value,kind:$("#ex-kind").value,date:$("#ex-date").value||today(),grade:$("#ex-grade").value,topic:$("#ex-topic").value.trim()});toast("Note gespeichert");break;
    case"log":s.log.push({id:uid(),date:$("#lg-date").value||today(),kind:$("#lg-kind").value,subject:$("#lg-sub").value,status:$("#lg-status").value,note:$("#lg-note").value.trim()});toast("Eintrag gespeichert");break;
    case"teacher":{const n=$("#t-name").value.trim();if(!n){toast("Bitte einen Namen eintragen");return}DB.teachers.push({id:uid(),name:n,group:$("#t-group").value});toast(n+" hinzugefügt");break}
  }
  save();render();
});
let noteTimer;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==="note"){const s=cur();s.note=e.target.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,400)}
});
document.addEventListener("change",e=>{const g=e.target.dataset?.tgroup;if(!g)return;const t=DB.teachers.find(x=>x.id===g);t.group=e.target.value;if(!DB.teachers.some(x=>x.group==="leitung")){t.group="leitung";toast("Mindestens eine Person braucht die Leitung")}save();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sheet){ui.sheet=null;render()}});
render();
</script>
</body>
</html>
