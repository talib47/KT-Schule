<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT Schule</title>
<meta name="theme-color" content="#0E8A8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KT Schule">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/newsreader-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/newsreader-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* Layout: eine ruhige Spalte wie „Die Reihe“ — Platte „Heute“ als einziges kräftiges Element, Glas nur für die Tableiste unten und die Leiste im Lernmodus. Bandfarbe Petrol aus dem Kocatepe-Logo. */
:root{color-scheme:light;
  --bg:#F2F2F4; --surface:#FFFFFF; --ink:#1B1B1F; --muted:#5F5F66; --line:#E3E3E8;
  --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.18);
  --accent:#0A6F74; --accent-ink:#FFFFFF; --plate-top:#16A2A8; --plate-bot:#0A6469;
  --good:#2D7A4E; --bad:#B43A2E; --gold:#785810;
  --good-soft:color-mix(in srgb,var(--good) 10%,var(--surface)); --bad-soft:color-mix(in srgb,var(--bad) 9%,var(--surface));
  --tint:color-mix(in srgb,var(--accent) 11%,transparent);
  --thumb:#FFFFFF; --glass:rgba(250,250,252,.72); --glass-line:rgba(0,0,0,.07);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-l:24px; --r-m:18px;
  --lift:0 1px 2px rgba(0,0,0,.04),0 16px 36px -18px rgba(0,0,0,.22);
  --float:0 10px 30px -12px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#000000; --surface:#1C1C1E; --ink:#F3F3F5; --muted:#9D9DA5; --line:#2F2F34;
  --fill:rgba(118,118,128,.20); --fill2:rgba(118,118,128,.30);
  --accent:#4CC6CB; --accent-ink:#06282A; --plate-top:#138E94; --plate-bot:#08494D;
  --good:#62C48C; --bad:#F2897E; --gold:#DDB35A;
  --tint:color-mix(in srgb,var(--accent) 17%,transparent);
  --thumb:#5B5B60; --glass:rgba(30,30,33,.70); --glass-line:rgba(255,255,255,.09);
  --lift:0 0 0 1px rgba(255,255,255,.05),0 22px 44px -20px rgba(0,0,0,.9);
  --float:0 12px 34px -12px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.08)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000000; --surface:#1C1C1E; --ink:#F3F3F5; --muted:#9D9DA5; --line:#2F2F34;
  --fill:rgba(118,118,128,.20); --fill2:rgba(118,118,128,.30);
  --accent:#4CC6CB; --accent-ink:#06282A; --plate-top:#138E94; --plate-bot:#08494D;
  --good:#62C48C; --bad:#F2897E; --gold:#DDB35A;
  --tint:color-mix(in srgb,var(--accent) 17%,transparent);
  --thumb:#5B5B60; --glass:rgba(30,30,33,.70); --glass-line:rgba(255,255,255,.09);
  --lift:0 0 0 1px rgba(255,255,255,.05),0 22px 44px -20px rgba(0,0,0,.9);
  --float:0 12px 34px -12px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);letter-spacing:-.003em;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:2px}
#app{max-width:42rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));overflow-wrap:break-word}
body.focus #app{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto;text-wrap:balance}
h1{font-size:2.125rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:1.375rem;font-weight:600;line-height:1.2;letter-spacing:-.012em;margin:0 0 10px}
p{margin:0;text-wrap:pretty}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--muted);margin:0 0 8px;line-height:1.35}
.small{font-size:.875rem} .muted{color:var(--muted)}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:1.0625rem;font-weight:650;letter-spacing:-.008em;margin:26px 2px 10px}
.sect span+span{font-size:.8125rem;font-weight:500;color:var(--muted)}
.block{background:var(--surface);border-radius:var(--r-m);padding:18px;margin:0 0 12px}
.list{background:var(--surface);border-radius:var(--r-m);padding:0 18px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:12px 20px;border:0;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.1);transition:transform .16s cubic-bezier(.3,.7,.4,1),filter .16s}
.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.93)}
.btn.ghost{background:var(--tint);color:var(--accent);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.crumb{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:none;padding:0;margin:-6px 0 6px;font-weight:600;font-size:.9375rem;color:var(--accent)}
.chip{display:inline-block;border-radius:999px;background:var(--fill);color:var(--muted);padding:3px 9px;font-weight:600;font-size:.75rem;white-space:nowrap}
.chip.goal{background:var(--tint);color:var(--accent)}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.bar{height:4px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* Platte „Heute“ */
.today{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-l);padding:22px 20px 20px;margin:0 0 12px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.14),transparent 55%),linear-gradient(165deg,var(--plate-top),var(--plate-bot));box-shadow:0 18px 36px -26px var(--plate-bot)}
.today .mark{position:absolute;right:-26px;bottom:-30px;width:210px;z-index:-1;fill:#fff;opacity:.09;pointer-events:none}
.today .eyebrow{color:rgba(255,255,255,.82)}
.today h2{color:#fff;font-size:1.75rem;letter-spacing:-.018em;margin:2px 0 12px}
.today ol{margin:4px 0 16px;padding-left:1.3em}
.today li{margin:.45em 0}
.today li::marker{color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.today li span{display:block;color:rgba(255,255,255,.8);font-size:.875rem}
.today .btn{background:#fff;color:var(--plate-bot);box-shadow:0 10px 22px -12px rgba(0,0,0,.55)}
.today .done{color:rgba(255,255,255,.9);margin:0 0 14px}

/* Listenzeilen */
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:14px 0;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
.item:active{opacity:.5}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:600 1.125rem/1 var(--serif);color:var(--accent);background:var(--tint);grid-row:span 2}
.item .t{font-weight:600;letter-spacing:-.006em;min-width:0}
.item .d{grid-column:2;font-size:.8125rem;color:var(--muted)}
.item .r{grid-row:span 2;color:var(--muted);display:flex;align-items:center;gap:8px}
.item .bar{grid-column:2;margin-top:4px}

/* Woche */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;align-items:end}
.week .d{padding:8px 0 6px;border-radius:14px}
.week .d.now{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.week .bw{height:64px;display:flex;align-items:flex-end;justify-content:center}
.week .bw i{width:56%;max-width:1.5rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 32%,var(--surface));min-height:5px}
.week .now .bw i{background:var(--accent)}
.week .n{font:600 1.0625rem/1 var(--serif);margin-top:6px;font-variant-numeric:tabular-nums}
.week .dt{font-size:.75rem;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border-radius:var(--r-m);padding:14px}
.stats b{display:block;font:600 1.75rem/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stats span{font-size:.8125rem;color:var(--muted)}
.motiv{font-family:var(--serif);font-size:1.0625rem;line-height:1.4;color:var(--muted);margin-top:14px}

/* Tableiste aus Glas */
nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 4px));z-index:9;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--float),inset 0 0 0 .5px var(--glass-line);transition:transform .38s cubic-bezier(.3,.7,.3,1),opacity .25s}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:none;border-radius:999px;font-size:.6875rem;font-weight:600;color:var(--muted)}
nav svg{width:24px;height:24px}
nav svg .f{fill:currentColor;fill-opacity:0}
nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
nav button[aria-current="page"] svg .f{fill-opacity:.22}
@media (min-width:700px){nav{left:calc(50% - 15rem);right:auto;width:30rem}nav button{flex-direction:row;gap:7px;min-height:46px;font-size:.8125rem}}
body.focus nav{transform:translateY(calc(100% + 48px));opacity:0;pointer-events:none}

/* Lernmodus */
#fbar{position:sticky;top:0;z-index:8;padding-top:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--glass-line)}
#fbar .in{max-width:42rem;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#fbar .x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--fill);display:grid;place-items:center}
#fbar .p{flex:1;height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
#fbar .p i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s cubic-bezier(.3,.7,.3,1)}
#fbar .n{min-width:3.2em;text-align:right;font-size:.8125rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.task{position:relative;isolation:isolate;margin:6px 0 22px}
.task::before{content:"";position:absolute;top:18px;bottom:-8px;left:26px;right:26px;border-radius:var(--r-l);background:var(--surface);opacity:.7;z-index:-1}
.qcard{background:var(--surface);border-radius:var(--r-l);padding:22px 20px;box-shadow:var(--lift);display:grid;gap:14px;min-height:12rem;align-content:start}
.qcard .ctx{font-size:.8125rem;font-weight:600;color:var(--muted)}
.qcard .q{font:500 1.75rem/1.25 var(--serif);letter-spacing:-.012em}
.qcard .q.long{font-size:1.375rem}
.ans{display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:16px;background:var(--fill);font:600 2rem/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:.02em;border:1.5px solid transparent}
.ans.empty{color:var(--muted);font:500 1rem/1 var(--sans)}
.ans.r{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.ans.w{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
input.ans{width:100%;text-align:center;outline:none}
input.ans:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:58px;border:0;border-radius:14px;background:var(--surface);font:500 1.5rem/1 var(--sans);box-shadow:0 1px 1px rgba(0,0,0,.06)}
.pad button:active{background:var(--fill2)}
.pad .ok{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);font-size:1.0625rem;font-weight:600}
.opts{display:grid;gap:8px}
.opts button{min-height:56px;border:1.5px solid transparent;border-radius:14px;background:var(--surface);font-size:1.125rem;font-weight:500;text-align:left;padding:12px 16px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.opts.two{grid-template-columns:1fr 1fr}.opts.two button{text-align:center}
.opts button.r{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.opts button.w{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.fb{border-radius:16px;padding:14px 16px;background:var(--bad-soft);display:grid;gap:4px}
.fb b{color:var(--bad)}
.fb.ok{background:var(--good-soft)}.fb.ok b{color:var(--good)}
.end{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:20px}
.end .big{font:600 4rem/1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
/* Anmeldung */
.logo{width:88px;height:88px;border-radius:20px;box-shadow:var(--lift)}
.codein{width:100%;text-align:center;font:600 1.75rem/1 var(--serif);letter-spacing:.25em;text-transform:uppercase;border:1.5px solid transparent;background:var(--fill);border-radius:14px;padding:14px;outline:none}
.codein:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.err{color:var(--bad);font-size:.875rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:color-mix(in srgb,var(--ink) 90%,transparent);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:600;font-size:.875rem;z-index:20;box-shadow:var(--float)}
@media (prefers-reduced-motion:no-preference){#app.vin{animation:vin .26s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translate3d(0,6px,0)}}
  .qcard.pop{animation:pop .25s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:.4;transform:translate3d(14px,0,0)}}}
@media (prefers-reduced-transparency:reduce){nav,#fbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (min-width:768px){body{font-size:17px}}

/* ---------- Ergänzungen Lehrerbereich ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{margin-bottom:0}
.headwrap{margin:0 0 18px}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:2px;gap:2px}
.seg button{border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:.875rem;padding:7px 12px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--thumb);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn.small{min-height:36px;padding:8px 14px;border-radius:11px;font-size:.875rem}
.btn.warn{background:color-mix(in srgb,var(--bad) 11%,transparent);color:var(--bad);box-shadow:none}
.item .ic.g-jungs{color:var(--jungs);background:color-mix(in srgb,var(--jungs) 12%,transparent)}
.item .ic.g-maedchen{color:var(--maedchen);background:color-mix(in srgb,var(--maedchen) 12%,transparent)}
.item .ic.g-leitung{color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,transparent)}
.item .r .chip{margin-left:2px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.bh h2{margin:0;font-size:1.25rem}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:center}
.kv>*{padding:11px 0;border-top:1px solid var(--line)}
.kv>.h{border-top:0;padding-top:0;font-size:.75rem;font-weight:600;color:var(--muted)}
.kv .num{text-align:right;font-variant-numeric:tabular-nums}
.gr{display:inline-block;min-width:2.3em;text-align:center;font-weight:650;border-radius:8px;padding:1px 6px;font-variant-numeric:tabular-nums}
.gr.g1{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.gr.g2{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.gr.g3{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--fill);padding:5px 6px 5px 12px;font-size:.875rem;font-weight:500}
.tag.goal{background:var(--tint);color:var(--accent)}
.tag button{border:0;background:none;width:24px;height:24px;border-radius:50%;color:inherit;opacity:.7;font-size:1rem;line-height:1}
.tag.add{padding:5px 12px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.mini div{background:var(--fill);border-radius:14px;padding:10px 12px}
.mini b{display:block;font:600 1.375rem/1.1 var(--serif);font-variant-numeric:tabular-nums}
.mini span{font-size:.75rem;color:var(--muted)}
.log{display:grid;gap:0}
.log>div{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.log>div:first-child{border-top:0;padding-top:0}
.log .dt{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px;min-width:3.4em}
.log .tx{min-width:0}
.log .tx small{display:block;color:var(--muted);font-size:.8125rem}
.st{font-size:.75rem;font-weight:650;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.st.part{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.st.no{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
details.block>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:28px;font:600 1.25rem/1.2 var(--serif)}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::after{content:"›";font:400 1.25rem/1 var(--sans);color:var(--muted);transition:transform .25s}
details.block[open]>summary::after{transform:rotate(90deg)}
details.block[open]>summary{margin-bottom:12px}
textarea.note{width:100%;min-height:96px;resize:vertical;border:1px solid transparent;border-radius:14px;background:var(--fill);padding:12px 14px;font:inherit;color:inherit;line-height:1.5;outline:none}
textarea.note:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.codebig{font:600 1.5rem/1 var(--serif);letter-spacing:.18em;font-variant-numeric:tabular-nums}
/* Stundenplan */
.tt{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px}
.tt .h{font-size:.75rem;font-weight:600;color:var(--muted);text-align:center;padding:2px 0}
.tt .n{font-size:.75rem;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}

const CLOUD=/github\.io$/.test(location.hostname)&&!!window.supabase;

/* ---------- Aufgaben-Bibliothek: Themen erzeugen beliebig viele Aufgaben ---------- */
const VERBS=[["go","went"],["see","saw"],["buy","bought"],["eat","ate"],["take","took"],["come","came"],["write","wrote"],["read","read"],["run","ran"],["swim","swam"],["drink","drank"],["give","gave"],["get","got"],["make","made"],["think","thought"],["find","found"],["have","had"],["know","knew"],["sing","sang"],["sleep","slept"],["speak","spoke"],["tell","told"],["leave","left"],["bring","brought"],["catch","caught"],["fly","flew"],["drive","drove"],["sit","sat"],["win","won"]];

const WORDS=[["Hund","Nomen"],["laufen","Verb"],["schnell","Adjektiv"],["Schule","Nomen"],["schreiben","Verb"],["groß","Adjektiv"],["Freundin","Nomen"],["lachen","Verb"],["müde","Adjektiv"],["Baum","Nomen"],["spielen","Verb"],["leise","Adjektiv"],["Fenster","Nomen"],["denken","Verb"],["bunt","Adjektiv"],["Ferien","Nomen"],["helfen","Verb"],["warm","Adjektiv"]];
const PRON=[["He ___ football every day.",["play","plays"],1],["They ___ in Duisburg.",["live","lives"],0],["She ___ English.",["speak","speaks"],1],["I ___ my homework.",["do","does"],0],["My brother ___ TV.",["watch","watches"],1],["We ___ to school.",["go","goes"],0],["It ___ a lot here.",["rain","rains"],1],["You ___ fast.",["run","runs"],0]];
const TOPICS={
  "m-1x1":{s:"Mathe",n:"Einmaleins",k:[2,6],kind:"pad",gen(){const a=R(2,10),b=R(2,10);return Math.random()<.7?{q:`${a} · ${b}`,a:[String(a*b)],ex:`${a} · ${b} = ${a*b}`}:{q:`${a*b} : ${a}`,a:[String(b)],ex:`${a} · ${b} = ${a*b}, also ${a*b} : ${a} = ${b}`}}},
  "m-pm":{s:"Mathe",n:"Plus und Minus bis 1000",k:[2,5],kind:"pad",gen(){const a=R(100,800),b=R(20,199);return Math.random()<.5?{q:`${a} + ${b}`,a:[String(a+b)],ex:`${a} + ${b} = ${a+b}`}:{q:`${a} − ${b}`,a:[String(a-b)],ex:`${a} − ${b} = ${a-b}`}}},
  "m-kuerzen":{s:"Mathe",n:"Brüche kürzen",k:[6,8],kind:"pad",frac:1,gen(){let x,y;do{x=R(1,9);y=R(2,12)}while(x>=y||gcd(x,y)!==1);const f=R(2,6);return{q:`Kürze ${x*f}/${y*f}`,a:[`${x}/${y}`],ex:`Größter gemeinsamer Teiler ist ${f}: ${x*f} : ${f} = ${x}, ${y*f} : ${f} = ${y}`}}},
  "m-erweitern":{s:"Mathe",n:"Brüche erweitern",k:[6,7],kind:"pad",frac:1,gen(){let x,y;do{x=R(1,7);y=R(2,9)}while(x>=y);const f=R(2,6);return{q:`${x}/${y} = ?/${y*f}`,a:[String(x*f),`${x*f}/${y*f}`],ex:`Nenner mal ${f}, also Zähler auch: ${x} · ${f} = ${x*f}`}}},
  "m-prozent":{s:"Mathe",n:"Prozent berechnen",k:[7,9],kind:"pad",gen(){for(;;){const p=pick([10,20,25,50,5,15,30,75]),G=pick([20,40,60,80,120,200,240,300,400]),W=p*G/100;if(Number.isInteger(W))return{q:`${p} % von ${G}`,a:[String(W)],ex:`${G} : 100 · ${p} = ${W}`}}}},
  "m-gleichung":{s:"Mathe",n:"Gleichungen lösen",k:[7,9],kind:"pad",neg:1,gen(){const x=R(-5,9),a=R(2,7),b=R(-9,12),c=a*x+b;return{q:`${a}x ${b<0?"− "+(-b):"+ "+b} = ${c}`,a:[String(x)],ex:`${b<0?"+ "+(-b):"− "+b} auf beiden Seiten: ${a}x = ${c-b}, dann : ${a}, also x = ${x}`}}},
  "e-past":{s:"Englisch",n:"Simple Past (unregelmäßig)",k:[5,9],kind:"text",gen(){const [v,p]=pick(VERBS);return{q:`${v} → simple past`,a:[p],ex:`${v} – ${p}`}}},
  "e-s":{s:"Englisch",n:"he, she, it – das s",k:[5,6],kind:"choice",gen(){const [q,o,c]=pick(PRON);return{q,opts:o,c,ex:c?"Bei he, she, it hängt im Simple Present ein s an.":"Bei I, you, we, they kein s."}}},

};

  return steps;
}

const norm=s=>String(s).toLowerCase().replace(/−/g,"-").replace(/,/g,".").replace(/\s+/g," ").trim();
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function answer(given){
  const r=ui.run,x=r.q[r.i],it=x.it;
  const ok=x.kind==="choice"?given===it.c:it.a.some(a=>norm(a)===norm(given));
  r.state=ok?"r":"w";
  if(x.tries===0){if(ok)r.first++;if(x.t)record(x.t,ok);else countDay()}
  if(ok&&x.rev)P.wrongs=P.wrongs.filter(w=>!same(w.it,it));
  if(!ok){if(x.t&&!P.wrongs.some(w=>same(w.it,it))){P.wrongs.unshift({t:x.t,kind:x.kind,ctx:x.ctx,it});P.wrongs=P.wrongs.slice(0,30)}
    if(x.tries<2)r.q.splice(Math.min(r.i+3,r.q.length),0,{...x,tries:x.tries+1})}
  saveP();render();
  if(ok)setTimeout(()=>{if(ui.run===r&&r.state==="r")next()},650);
}

async function uploadDoc(){
  const sh=ui.sheet,s=cur(),f=$("#up-file").files[0]||sh.file,name=($("#up-name").value.trim()||f?.name||"").slice(0,120);
  if(!f){sh.err="Bitte eine Datei auswählen.";render();return}
  if(f.size>10*1024*1024){sh.err="Die Datei ist größer als 10 MB.";render();return}
  if(!/pdf|png|jpe?g|heic/i.test(f.type||f.name)){sh.err="Bitte PDF, JPG oder PNG wählen.";render();return}
  const doc={id:uid(),sid:s.id,kind:sh.d.kind,name,mime:f.type||"application/octet-stream",size:f.size,date:today()};
  if(!CLOUD){if(f.size>1.5*1024*1024){toast("In der Vorschau wird nur der Eintrag gespeichert");doc.data=null}else doc.data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    DB.docs.push(doc);save();ui.sheet=null;toast(doc.kind+" gespeichert");render();return}
  ui.busy=true;render();
  const path=`${s.id}/${doc.id}-${f.name.replace(/[^A-Za-z0-9._-]/g,"_").slice(-60)}`;
  const up=await sb.storage.from("docs").upload(path,f,{contentType:doc.mime,upsert:false});
  if(up.error){ui.busy=false;sh.err="Hochladen hat nicht geklappt. "+(DB.docsReady?"Prüfe dein Internet.":"Skript 04 fehlt noch.");render();return}
  const ins=await sb.from("documents").insert({student_id:s.id,kind:doc.kind,name,path,mime:doc.mime,size:f.size}).select("id,created_at").single();
  ui.busy=false;
  if(ins.error){sb.storage.from("docs").remove([path]);sh.err="Speichern hat nicht geklappt.";render();return}
  DB.docs.push({...doc,id:ins.data.id,path,date:ins.data.created_at.slice(0,10)});ui.sheet=null;toast(doc.kind+" gespeichert");render();
}
/* Hinweise oben im Lehrerbereich: eigener Einsatz, offene Termine, fehlende Verträge */
function times(e){const m=(e.time||"").match(/(\d{1,2})[:.](\d{2})\D+(\d{1,2})[:.](\d{2})/);if(!m)return null;const d=new Date(e.date+"T00:00");const a=new Date(d),b=new Date(d);a.setHours(+m[1],+m[2]);b.setHours(+m[3],+m[4]);return{a,b}}
function hints(){
  const H=[],now=new Date(),in7=addDays(today(),7),meId=DB.me;
  const mine=DB.duty.entries.filter(e=>e.who.includes(meId)&&e.date>=today()&&e.date<=in7).sort((a,b)=>a.date.localeCompare(b.date));
  mine.forEach(e=>{const t=times(e);let txt;
    if(e.date===today()&&t){const min=Math.round((t.a-now)/60000),end=Math.round((t.b-now)/60000);
      txt=min>60?`Heute bist du dran, ab ${e.time.split(/[–-]/)[0]}`:min>0?`Heute: beginnt in ${min} Minuten`:end>0?`Läuft gerade, endet in ${end} Minuten`:null}
    else txt=`Diese Woche bist du dran: ${wday(e.date)} ${fdate(e.date)}, ${e.time}`;
    if(txt)H.push({k:"term",v:e.id,t:txt,c:"me"})});
  DB.duty.entries.filter(e=>!e.who.length&&e.date>=today()&&e.date<=in7&&(lead()||e.grp===me().group)).forEach(e=>H.push({k:"term",v:e.id,t:`${wday(e.date)} ${fdate(e.date)} (${GROUPS[e.grp].label}): noch niemand eingetragen`,c:"open"}));
  const noV=visible().filter(s=>!DB.docs.some(d=>d.sid===s.id&&d.kind==="Vertrag"));
  if(noV.length)H.push({k:noV.length===1?"stu":"none",v:noV[0].id,t:noV.length===1?`Vertrag von ${noV[0].first} fehlt noch`:`${noV.length} Schüler ohne Vertrag`,c:"doc"});
  return H;
}
function hintsBlock(){const H=hints();if(!H.length)return"";
  return`<div class="hints">${H.map(h=>`<button class="hint ${h.c}" data-act="hint" data-k="${h.k}" data-v="${h.v}"><i></i><span>${esc(h.t)}</span><span class="r">›</span></button>`).join("")}</div>`}
/* Kalenderdatei: iPhone und Android erinnern dann von selbst (1 Stunde vorher und 30 Minuten vor Ende) */
function downloadIcs(list,title){
  if(!list.length){toast("Keine Termine");return}
  const pad=n=>String(n).padStart(2,"0"),f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const ev=list.map(e=>{const t=times(e)||{a:new Date(e.date+"T16:30"),b:new Date(e.date+"T19:30")};const who=e.who.map(id=>DB.teachers.find(x=>x.id===id)?.name).filter(Boolean).join(", ");
    return["BEGIN:VEVENT","UID:"+e.id+"@kt-schule","DTSTAMP:"+f(new Date()),"DTSTART:"+f(t.a),"DTEND:"+f(t.b),"SUMMARY:KT Schule – "+GROUPS[e.grp].label+(who?" ("+who+")":""),"LOCATION:Homberger Straße 3\\, 47119 Duisburg",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Beginnt in 1 Stunde","TRIGGER:-PT60M","END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Endet in 30 Minuten","TRIGGER;RELATED=END:-PT30M","END:VALARM","END:VEVENT"].join("\r\n")});
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//KT Schule//DE","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
  try{const url=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));const a=document.createElement("a");a.href=url;a.download=title.replace(/\s+/g,"-")+".ics";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  catch(e){toast("Kalender konnte nicht erstellt werden")}
  if(!CLOUD)toast("In der Vorschau gesperrt, in der echten App klappt es");
}

  return`<button class="term${past?" past":""}" data-act="editTerm" data-v="${e.id}"><span class="day"><small>${wday(e.date)}</small><b>${new Date(e.date+"T12:00").getDate()}.</b></span>

}
function viewPlan(){

  up.forEach(e=>{const m=new Date(e.date+"T12:00").toLocaleDateString("de-DE",{month:"long"});if(m!==lastM){if(lastM)html+=`</div>`;html+=`<div class="wk">${m}</div><div class="list">`;lastM=m}html+=termRow(e)});

function readTask(){const d=ui.sheet.d;d.title=$("#tk-title").value.trim();d.minK=+$("#tk-min").value;d.maxK=+$("#tk-max").value;d.items.forEach((it,i)=>{it.q=$("#ti-q"+i).value;if(it.type==="choice")it.optText=$("#ti-o"+i).value;else it.ansText=$("#ti-a"+i).value})}
function readStudent(){const d=ui.sheet.d;d.first=$("#s-first").value.trim();d.last=$("#s-last").value.trim();d.klasse=+$("#s-kl").value;if(!$("#s-grp").disabled)d.group=$("#s-grp").value;d.schule=$("#s-schule").value.trim()}
function readTerm(){const d=ui.sheet.d;d.date=$("#tm-date").value;d.time=$("#tm-time").value.trim();d.note=$("#tm-note").value.trim();if($("#tm-n"))d.n=+$("#tm-n").value;if($("#tm-alt"))d.alt=$("#tm-alt").checked}
const toggle=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
const blankItem=type=>type==="choice"?{id:uid(),type,q:"",optText:"*\n"}:{id:uid(),type,q:"",ansText:""};
function saveTask(){
  readTask();const d=ui.sheet.d;
  if(!d.title)return"Bitte einen Titel eintragen.";if(d.minK>d.maxK)return"„Ab Klasse“ ist größer als „Bis Klasse“.";if(!d.groups.length)return"Bitte mindestens eine Gruppe wählen.";
  const items=[];
  for(const [i,it] of d.items.entries()){
    if(!it.q.trim())return`Aufgabe ${i+1}: Bitte eine Frage eintragen.`;
    if(it.type==="choice"){const lines=it.optText.split("\n").map(l=>l.trim()).filter(Boolean),stars=lines.filter(l=>l.startsWith("*")&&l.length>1);
      if(lines.length<2)return`Aufgabe ${i+1}: Bitte mindestens zwei Antworten eintragen.`;if(stars.length!==1)return`Aufgabe ${i+1}: Bitte genau eine Antwort mit * als richtig markieren.`;
      items.push({id:it.id,type:"choice",q:it.q.trim(),options:lines.map(l=>l.replace(/^\*\s*/,"")),correct:lines.findIndex(l=>l.startsWith("*"))})}
    else{const ans=it.ansText.split("|").map(a=>a.trim()).filter(Boolean);if(!ans.length)return`Aufgabe ${i+1}: Bitte die richtige Antwort eintragen.`;items.push({id:it.id,type:"input",q:it.q.trim(),answers:ans})}
  }
  const clean={id:d.id,subject:d.subject,title:d.title,minK:d.minK,maxK:d.maxK,groups:d.groups,items,created:d.created};
  const k=DB.sheets.findIndex(x=>x.id===d.id);if(k>=0)DB.sheets[k]=clean;else DB.sheets.push(clean);save();return null;
}

  if(r.state==="w"&&e.key==="Enter"){e.preventDefault();next();return}
  if(x.kind!=="pad"||r.state)return;const T=TOPICS[x.t]||{};
  if(/^[0-9]$/.test(e.key)||(e.key==="/"&&T.frac)||(e.key==="-"&&T.neg)){r.inp=(r.inp+(e.key==="-"?"−":e.key)).slice(0,8);render()}
  else if(e.key==="Backspace"){r.inp=r.inp.slice(0,-1);render()}
  else if(e.key==="Enter"&&r.inp)answer(r.inp);
});
if(CLOUD){sb.auth.onAuthStateChange((ev,s2)=>{session=s2;if(ev==="PASSWORD_RECOVERY"){ui.mode="newpw";ui.authErr="";render()}});sb.auth.getSession().then(x=>{session=x.data.session})}
render();

</script>
